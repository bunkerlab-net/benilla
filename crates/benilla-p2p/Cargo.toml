[package]
name = "benilla-p2p"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated, bounded peer-to-peer transport for the Benilla fork"

[dependencies]
snow = "0.10"
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
zeroize = "1"
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring", "portmapper"] }

[lints]
workspace = true

[dev-dependencies]
iroh = { version = "=1.3.0", default-features = false, features = ["test-utils"] }
