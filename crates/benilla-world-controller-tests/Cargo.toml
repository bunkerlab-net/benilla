[package]
name = "benilla-world-controller-tests"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Source-level app solo-world controller harness without Bevy linking"
[lints]
workspace = true
[dev-dependencies]
benilla-native-vmap-source = { path = "../benilla-native-vmap-source", features = ["synthetic-map-tests"] }
benilla-ui = { path = "../benilla-ui" }
rand = "0.8"
benilla-sim = { path = "../benilla-sim" }
benilla-config = { path = "../benilla-config" }
benilla-profile = { path = "../benilla-profile" }
benilla-protocol = { path = "../benilla-protocol" }
benilla-world-client = { path = "../benilla-world-client" }
benilla-world-data = { path = "../benilla-world-data" }
benilla-world-runtime = { path = "../benilla-world-runtime", features = ["synthetic-native-tests"] }
benilla-world-store = { path = "../benilla-world-store" }
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
benilla-native-nav = { path = "../benilla-native-nav" }
benilla-native-nav-generator = { path = "../benilla-native-nav-generator" }
benilla-native-terrain = { path = "../benilla-native-terrain" }
benilla-native-vmap = { path = "../benilla-native-vmap" }
benilla-formats = { path = "../benilla-formats" }

libc = "0.2"
