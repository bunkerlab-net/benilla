[package]
name = "benilla-native-geometry-tests"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish = false
description = "Exact app geometry mailbox and terrain proof tests without Bevy"
[lints]
workspace = true
[dev-dependencies]
benilla-native-nav = { path = "../benilla-native-nav" }
benilla-sim = { path = "../benilla-sim" }
benilla-world-runtime = { path = "../benilla-world-runtime", features = ["synthetic-native-tests"] }
benilla-formats = { path = "../benilla-formats" }
crossbeam-channel = "0.5"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full"] }
