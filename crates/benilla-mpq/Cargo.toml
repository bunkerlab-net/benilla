[package]
name = "benilla-mpq"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only MPQ archive reader for WoW 1.12.1 (build 5875)"

[lints]
workspace = true

[dependencies]
# Bounds-checked byte readers and the allocation cap on the header, block table and sectors.
benilla-bytes = { path = "../benilla-bytes" }
# Unlike upstream benilla, use zlib-rs for bounded capture speed.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Only the opt-in bounded reader's nonblocking, no-symlink archive opens.
libc = "0.2"

[dev-dependencies]
benilla-formats = { path = "../benilla-formats", default-features = false }
miniz_oxide = "0.8"
