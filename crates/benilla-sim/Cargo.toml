[package]
name = "benilla-sim"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Deterministic, provenance-tracked CMaNGOS simulation primitives (partial port)"

[lints]
workspace = true

[dependencies]
# Reuse the user-local DBC data contract; targeting functions themselves perform no I/O.
benilla-formats = { path = "../benilla-formats", default-features = false }
sha2 = "0.10"
# LLVM APFloat software binary32; Cargo.lock pins the published LLVM revision/checksum.
rustc_apfloat = "=0.2.3"

serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
