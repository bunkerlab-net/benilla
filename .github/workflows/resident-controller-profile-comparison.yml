# Isolated diagnostic comparison; normal CI and player-build gates are unchanged.
name: Resident controller profile comparison

on:
  push:
    branches: [feat/psk-p2p-foundation]
    paths:
      - .github/workflows/resident-controller-profile-comparison.yml
      - crates/benilla-app/src/net/p2p/world/native_geometry/mod.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/core.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_dispatch.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_dispatch/tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/freshness_timings.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/inventory.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/inventory_tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/tests/wrapper_equivalence.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/owned/freshness.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/owned/freshness/tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_dispatch/fifo.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_dispatch/fifo/tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_dispatch/transport.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/resident_result_controller_tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/retained_phased_controller_tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/retained.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/retained/observation_equivalence.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/chase_los.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/chase_los/equivalence.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/retained/prefix_equivalence.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/owned.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/products/source_height/owned/f05_scope.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/f05.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/tests/f05_equivalence.rs
      - scripts/verify-f05-privacy.py
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/phased.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/tests/cold_phased_negatives.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_filter/resident_owned/transport.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_resident_local.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_resident_local/ledger.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/source_route_resident_local/retained.rs
      - crates/benilla-native-vmap-source/src/lib.rs
      - crates/benilla-native-vmap-source/src/map_bundle.rs
      - crates/benilla-native-vmap-source/src/source.rs
      - crates/benilla-native-vmap-source/src/source_tests.rs
      - crates/benilla-native-vmap-source/src/profiling.rs
      - crates/benilla-native-vmap-source/src/profiling_source_tests.rs

permissions:
  contents: read

concurrency:
  group: resident-controller-profile-comparison-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare-controller-profiles:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Identify the exact comparison and its limits
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Same-head, same-runner serial profile comparison: $EXPECTED_HEAD"
          echo 'Identical default-feature cfg(test) fixtures; release profile is not the packaged no-default-features player.'
          echo 'Profile comparison uses a fixed 60s proof budget; a separate release step tests the default Route budget.'
          echo 'Receiver timing includes the test-only constructor_identity diagnostic, stops before final guards, and excludes checkpoint/ACK.'
          echo "BENILLA_SKIP_LOG=$RUNNER_TEMP/benilla-data-skips.log" >> "$GITHUB_ENV"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Test exact libtest proof gates
        run: python3 scripts/test-verify-libtest-output.py
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libwayland-dev
          pkg-config --exists wayland-client
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - name: Check formatting and module resolution
        run: cargo fmt --all -- --check
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          version: latest
          backend: github
          github-cache-mode: target
          cache-generation: resident-controller-profile-comparison-ubuntu26-v1
      - name: Compare the same five controller fixtures serially
        id: serial_comparison
        shell: bash
        run: |
          set -euo pipefail
          for profile in test release; do
            args=()
            if [[ "$profile" == release ]]; then
              args+=(--release)
            fi
            echo "::group::$profile profile: prerequisite and controller fixtures"
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            # This integration test also builds the helper in the matching profile.
            log="$RUNNER_TEMP/controller-$profile-navigation-helper.log"
            mbx test --locked "${args[@]}" -p benilla-native-nav-generator --test process empty_request_runs_without_inherited_environment -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" empty_request_runs_without_inherited_environment
            log="$RUNNER_TEMP/controller-$profile-transport.log"
            # show-output exposes successful timing diagnostics without nocapture's
            # interleaving, preserving the exact stdout-only libtest verifier.
            mbx test --locked "${args[@]}" -p benilla-app --lib net::p2p::native_geometry::resident_result_controller_tests:: -- --skip resident_default_budget_controller_saves_cold_and_first_retained --skip resident_f05_default_budget_actual_controller_comparison --skip resident_f05_held_source_control_cancel_and_quit_never_ack --skip resident_f05_current_scene_and_source_changes_refuse_before_save --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" \
              net::p2p::native_geometry::resident_result_controller_tests::resident_result_transport_actual_controller_saves_cold_and_first_retained \
              net::p2p::native_geometry::resident_result_controller_tests::resident_result_transport_checkpoint_failure_precedes_ack_and_recovery_never_reruns \
              net::p2p::native_geometry::resident_result_controller_tests::resident_result_transport_lost_ack_retries_exact_notice_without_reexecution \
              net::p2p::native_geometry::resident_result_controller_tests::resident_result_transport_changed_source_allows_historical_ack_not_fresh_geometry \
              net::p2p::native_geometry::resident_result_controller_tests::resident_result_transport_worker_ready_rechecks_current_physics_before_reply
            df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
            echo '::endgroup::'
          done
      - name: Compare two-turn retained certification with synchronous baseline
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Same runner/process comparison, default 500ms Work contract unchanged; no aggregate timing sum.'
          status=0
          for test in retained_phased_default_budget_comparison retained_phased_frame_cadenced_comparison; do
            name="net::p2p::native_geometry::retained_phased_controller_tests::$test"
            log="$RUNNER_TEMP/$test.log"
            if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
            if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          done
          exit "$status"
      - name: Compare cold split with retained-only split baseline
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Both arms keep retained splitting and the original 500ms Work lease; only cold splitting differs.'
          echo 'Cold per-service and prepare-to-final latency are separate; retained final remains an independent global floor.'
          status=0
          for test in cold_phased_default_budget_comparison cold_phased_frame_cadenced_comparison; do
            name="net::p2p::native_geometry::retained_phased_controller_tests::$test"
            log="$RUNNER_TEMP/$test.log"
            if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
            if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          done
          exit "$status"
      - name: Measure resident observer overhead without changing the Work budget
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Same BOTH-split frame fixture: OFF/count-only/clocked each once, original 500ms Work contract.'
          echo 'OFF keeps inactive hooks in the same instrumented binary; this measures activation overhead, not a pre-patch comparison.'
          echo 'Every arm reports failures. Inclusive source/guard categories are not added to outer spans; no overhead subtraction.'
          name=net::p2p::native_geometry::retained_phased_controller_tests::resident_observer_off_count_clocked_comparison
          log="$RUNNER_TEMP/resident-observer-overhead.log"
          status=0
          if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
          if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          exit "$status"
      - name: Validate the default Route budget in the release component fixture
        # Independent failures stay red without hiding later diagnostic results.
        # Require successful serial compilation/proofs; do not run after cancellation.
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Authored component scene only; not packaged-player or real-gameplay evidence.'
          echo 'Uses paired_test_mailbox default Route deadline, including final reply guards.'
          echo 'Separate full-tick timing includes save/ACK; it is not a 500ms whole-tick threshold.'
          name=net::p2p::native_geometry::resident_result_controller_tests::resident_default_budget_controller_saves_cold_and_first_retained
          log="$RUNNER_TEMP/controller-release-default-budget.log"
          mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" "$name"
      - name: Validate frame-cadenced mailbox cold and retained saves
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scheduled post-physics permit, then test-only mailbox service after App::update; not production process integration.'
          echo 'Default 500ms Route lease unchanged. Service/app-update/pump measurements are separate wall durations, not CPU.'
          name=net::p2p::native_geometry::frame_cadenced_controller_tests::frame_cadenced_mailbox_saves_cold_and_first_retained
          log="$RUNNER_TEMP/frame_cadenced_mailbox_saves_cold_and_first_retained.log"
          mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" "$name"
      - name: Validate missed-frame mailbox refusal without publication
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'Scheduled post-physics permit, then test-only mailbox service after App::update; not production process integration.'
          echo 'Default 500ms Route lease unchanged. Service/app-update/pump measurements are separate wall durations, not CPU.'
          name=net::p2p::native_geometry::frame_cadenced_controller_tests::frame_cadenced_mailbox_missed_frames_refuse_without_publication
          log="$RUNNER_TEMP/frame_cadenced_mailbox_missed_frames_refuse_without_publication.log"
          mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" "$name"
      - name: Compare one parked F05 against cold and retained split
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'One NON-frame actual FIFO pair, original500ms; retain both failures, no retries or overhead subtraction.'
          echo 'Actual F05 worker uses test-only CountOnly diagnostics and bounded cancel counters; no timing equivalence claim.'
          name=net::p2p::native_geometry::resident_result_controller_tests::resident_f05_default_budget_actual_controller_comparison
          log="$RUNNER_TEMP/resident-f05-paired.log"
          status=0
          if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
          if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          exit "$status"
      - name: Verify release F05 controls and current scene refusals
        if: ${{ !cancelled() && steps.serial_comparison.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for test in resident_f05_held_source_control_cancel_and_quit_never_ack resident_f05_current_scene_and_source_changes_refuse_before_save; do
            name="net::p2p::native_geometry::resident_result_controller_tests::$test"
            log="$RUNNER_TEMP/$test.log"
            if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact --ignored --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
            if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          done
          exit "$status"
      - name: Report final disk space
        if: always()
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
