# Build master pushes and maintainer-requested artifacts.
name: Build player

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-player-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - platform: linux-arm64
            runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
            archive: tar.gz
          - platform: windows-amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 2
      WOW_DATA: ""
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libasound2-dev libudev-dev
      - name: Install the repository toolchain
        run: |
          rustup toolchain install
          rustup target add "$BUILD_TARGET"
          rustc -Vv
          test "$(rustc -Vv | sed -n 's/^host: //p' | tr -d '\r')" = "$BUILD_TARGET"
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          version: latest
          backend: github
          github-cache-mode: target
          cache-generation: player-ubuntu26-v1
          save-on-workflow-dispatch: true
      - name: Test packaging
        run: python3 scripts/test-package-player.py
      - name: Prepare matching source and locked dependencies
        run: python3 scripts/package-player.py --prepare-source --commit "$GITHUB_SHA"
      - name: Build the player from the distributed source
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target"
          # Stable source/vendor paths let Cargo reuse restored dependency artifacts.
          cd .player-source/current
          mbx build --config .cargo/vendor-config.toml --offline --locked --release -p benilla --bin benilla --no-default-features --target "$BUILD_TARGET"
      - name: Package the matching source
        run: python3 scripts/package-player.py --source-only --platform "$BUILD_PLATFORM" --commit "$GITHUB_SHA"
      # Publish source first. A failed source upload must prevent binary publication.
      - name: Upload corresponding source and checksum
        id: source
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benilla-source-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/benilla-${{ matrix.platform }}-${{ github.sha }}-source.tar.gz
            dist/benilla-${{ matrix.platform }}-${{ github.sha }}-source.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Verify source outlives the player download
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ID: ${{ steps.source.outputs.artifact-id }}
        run: |
          # Repository retention limits can shorten the requested 90 days.
          # Refuse binary publication unless source lasts beyond its full 14 days.
          expiry=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ID" --jq .expires_at)
          python3 - "$expiry" <<'PYTHON'
          from datetime import datetime, timedelta, timezone
          import sys
          expiry = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          if expiry <= datetime.now(timezone.utc) + timedelta(days=15):
              raise SystemExit("Source retention must exceed 15 days before publishing a 14-day player")
          PYTHON
      - name: Package the lightweight player with exact source link
        env:
          SOURCE_URL: ${{ steps.source.outputs.artifact-url }}
        run: python3 scripts/package-player.py --platform "$BUILD_PLATFORM" --commit "$GITHUB_SHA" --source-url "$SOURCE_URL"
      - name: Upload the archive and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benilla-${{ matrix.platform }}-${{ github.sha }}
          path: |
            dist/benilla-${{ matrix.platform }}-${{ github.sha }}.${{ matrix.archive }}
            dist/benilla-${{ matrix.platform }}-${{ github.sha }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
