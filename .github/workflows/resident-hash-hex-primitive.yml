# Primitive measurement only: no runtime encoder adoption or authority changes.
name: Resident hash and hex primitive measurement

on:
  push:
    branches: [feat/psk-p2p-foundation]
    paths:
      - .github/workflows/resident-hash-hex-primitive.yml
      - crates/benilla-app/src/net/p2p/world/native_geometry/hash_hex_primitive_tests.rs
      - crates/benilla-app/src/net/p2p/world/native_geometry/mod.rs
      - crates/benilla-native-vmap-source/src/source.rs
      - crates/benilla-native-vmap-source/src/map_bundle.rs

permissions:
  contents: read

concurrency:
  group: resident-hash-hex-primitive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure-primitives:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Identify measurement scope
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Exact primitive candidate: $EXPECTED_HEAD"
          echo 'Test-only encoder, not adopted by source reads or runtime verification.'
          echo 'Full-path samples rehash every payload and allocate/drop the resulting String.'
          echo 'Isolated encoding samples cannot establish full hash-plus-encoding benefit.'
          echo 'No original 500ms controller evidence is replaced by this primitive diagnostic.'
      - name: Test strict proof gates
        run: python3 scripts/test-verify-libtest-output.py
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libwayland-dev
          pkg-config --exists wayland-client
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - name: Check formatting and module resolution
        run: cargo fmt --all -- --check
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@88acf2bb50552c7c508cbac13e5f8c576b95b1de # v1.7.3
        with:
          version: latest
          backend: github
          github-cache-mode: target
          cache-generation: resident-controller-profile-comparison-ubuntu26-v1
      - name: Verify encoder equivalence and measure the bounded primitive
        id: primitive
        shell: bash
        run: |
          set -euo pipefail
          status=0
          for test in hash_hex_encoding_matches_original fixture_hash_hex_primitive_comparison; do
            name="net::p2p::native_geometry::hash_hex_primitive_tests::$test"
            args=()
            if [[ "$test" == fixture_hash_hex_primitive_comparison ]]; then args+=(--ignored); fi
            log="$RUNNER_TEMP/$test.log"
            if ! mbx test --locked --release -p benilla-app --lib "$name" -- --exact "${args[@]}" --show-output --test-threads=1 --color never | tee "$log"; then status=1; fi
            if ! python3 scripts/verify-libtest-output.py "$log" "$name"; then status=1; fi
          done
          exit "$status"
      - name: Preserve primitive logs
        # No logs exist when an earlier gate prevented any measurement attempt.
        if: ${{ always() && steps.primitive.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resident-hash-hex-primitive
          path: |
            ${{ runner.temp }}/hash_hex_encoding_matches_original.log
            ${{ runner.temp }}/fixture_hash_hex_primitive_comparison.log
          if-no-files-found: error
          retention-days: 7
