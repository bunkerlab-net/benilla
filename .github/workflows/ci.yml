      - name: Verify native retained straight bridge
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-retained-straight-bridge.log"
          mbx test --locked -p benilla-native-nav --lib source_cold_same_polygon::retained_straight::tests:: -- --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            source_cold_same_polygon::retained_straight::tests::allocation_endpoints_configuration_width_and_cap_errors_do_not_mutate_priors \
