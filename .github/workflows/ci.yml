            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::restart::rewarded_loaded_quest_late_replay_after_loot_preserves_bytes_and_releases_owners
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
