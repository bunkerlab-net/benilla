          python3 scripts/verify-libtest-output.py "$log" source_cold_same_polygon::retained_straight::oracle_tests::original_cold_origin_sequences_match_retained_straight_storage_types_points_and_traces
      - name: Verify native retained primitive budgets
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-retained-primitive-budgets.log"
          mbx test --locked -p benilla-native-nav --lib source_cold_same_polygon::retained_tests::retained_budget_ -- --show-output --test-threads=1 --color never | tee "$log"
