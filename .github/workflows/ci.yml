            source_cold_same_polygon::retained_straight::detail::tests::shared_detail_diagonal_keeps_original_first_matching_triangle \
            source_cold_same_polygon::retained_straight::detail::tests::witness_retains_query_and_token_without_retaining_terminal_or_ancestors
      - name: Verify supplemental retained endpoint provenance
