# The gates of scripts/gates.sh that need neither a WoW install nor a display, on Linux, for a pull
# request: a red one is seen before anyone builds it. The data-gated tests, the engine
# boot checks and a live run happen on the maintainer's machine before it lands.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace-gates:
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      # Bound peak memory while preserving the complete workspace and player test suites.
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_TEST_DEBUG: 0
      # No debuginfo: it is most of target/, and a runner's disk is small.
      CARGO_PROFILE_DEV_DEBUG: 0
      # Set and empty: no install, as the gates' test-no-install runs.
      WOW_DATA: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Track unavailable data checks
        run: echo "BENILLA_SKIP_LOG=$RUNNER_TEMP/benilla-data-skips.log" >> "$GITHUB_ENV"
      - name: Report available disk space
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Test exact libtest proof gates
        run: python3 scripts/test-verify-libtest-output.py
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config libasound2-dev libudev-dev libwayland-dev
          # Standalone corridor tests link Wayland without the app clipboard's dlopen feature.
          pkg-config --exists wayland-client
      - name: Toolchain
        run: rustup toolchain install && rustc -V
      - name: Set up Mr Boxington
        uses: jdx/mr-boxington-action@47ce49b32025d93a7a2f4570815afaa2b7092240 # v1.7.2
        with:
          version: latest
          backend: github
          github-cache-mode: target
          cache-generation: ci-ubuntu26-v1
          # Same-repository PR writes stay in that PR's cache scope; forks never save.
          save-on-pull-request: true
          save-on-workflow-dispatch: true
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: mbx clippy --locked --workspace --all-targets -- -D warnings
      - name: Verify profile persistence and Dwarf character creation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/profile-lib.log"
          mbx test --locked -p benilla-profile --lib -- --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            tests::create_select_save_reopen_preserves_identity_and_characters \
            tests::signatures_bind_owner_domain_and_challenge \
            tests::invalid_creation_and_position_do_not_change_valid_save \
            tests::classic_race_class_matrix_and_limits \
            tests::opening_missing_never_creates_and_create_never_replaces \
            tests::exclusive_session_lock_released_on_drop \
            tests::corruption_fails_closed_retains_previous_and_never_regenerates \
            tests::schema_size_checksum_and_owner_checks_fail_closed \
            tests::externally_modified_file_is_not_overwritten \
            tests::failed_save_retains_memory_and_current \
            tests::public_canonical_character_contains_no_secret_and_roundtrips \
            tests::unix_private_modes_symlinks_and_hardlinks \
            tests::replaced_lock_and_symlink_backup_fail_without_overwrite \
            tests::pre_commit_io_failures_preserve_current_backup_and_memory \
            tests::post_rename_failure_preserves_backup_and_requires_reopen \
            tests::closing_profile_unlocks_even_with_an_inherited_file_description \
            tests::archive_and_restore_after_restart_preserve_identity_other_characters_and_world_bytes \
            tests::wrong_owner_stale_duplicate_and_conflicting_restore_never_mutate \
            tests::archive_and_active_limits_never_evict_records \
            tests::archive_and_restore_precommit_failures_preserve_current_and_memory \
            tests::archive_and_restore_uncertain_commit_require_reopen_and_never_duplicate \
            tests::version_one_checksum_verified_before_lossless_read_only_open_and_explicit_mutation \
            tests::failed_version_one_migration_keeps_original_bytes_and_uncertain_migration_can_reopen \
            tests::archive_validation_covers_owner_id_name_and_selected_character \
            tests::unchanged_position_checkpoint_verifies_disk_without_rewriting \
            tests::unchanged_position_cannot_hide_uncertain_checkpoint \
            tests::appearance_bytes_preserve_catalog_choices_and_reject_malformed_json \
            world_setup::tests::separate_sidecar_preserves_profile_bytes_and_reopens_signed_selection \
            world_setup::tests::exact_replay_returns_same_world_and_conflicts_stale_or_foreign_requests_fail \
            world_setup::tests::declaration_tampering_wrong_owner_and_transport_domain_fail \
            world_setup::tests::sidecar_cannot_be_copied_to_another_profile_or_silently_recovered \
            world_setup::tests::invalid_and_oversize_inputs_do_not_create_setup_state \
            world_setup::tests::world_limit_and_selection_validation_preserve_prior_declarations \
            world_setup::tests::uncertain_commit_latches_both_setup_and_profile_until_reopen \
            world_setup::tests::failed_precommit_preserves_previous_selection_and_cas_rejects_changed_sidecar \
            world_setup::tests::changed_profile_identity_prevents_setup_signing \
            world_setup::tests::symlink_hardlink_and_permissions_are_rejected_without_touching_targets \
            world_setup::tests::tampered_signed_selection_and_oversize_sidecar_are_preserved_and_rejected \
            world_setup::tests::full_replay_history_is_never_evicted_and_exact_replay_still_succeeds \
            starting_location::tests::all_forty_combinations_create_persist_move_reopen_and_recover_without_reset \
            starting_location::tests::mismatched_and_invalid_combinations_never_write_or_fall_back \
            starting_location::tests::legacy_positions_and_policy_are_unchanged_by_new_source_support \
            starting_location::tests::malformed_missing_duplicate_wrong_revision_and_unsupported_rows_fail_closed \
            starting_location::tests::only_canonical_finite_decimal_strings_are_accepted \
            starting_location::tests::captured_table_hash_matches_existing_python_canonicalizer \
            recovery::tests::help_and_bad_arguments_never_open_or_create_a_profile \
            recovery::tests::player_commands_list_and_restore_exact_id_after_restart \
            storage::schema_tests::semantic_validation_survives_recomputed_checksums \
            storage::schema_tests::valid_encoding_is_stable_and_checksum_detects_valid_json_corruption
          tests=(
            net::p2p::tests::dwarf_catalog_beard_creates_reopens_and_invalid_options_never_write
            net::p2p::tests::peer_intro_requires_authenticated_owner_valid_traits_and_unique_game_identity
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify all-race appearance choices and Random paths
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/glue-hair-color-counts.log"
          mbx test --locked -p benilla-ui --lib script::glue_create::tests::a_hair_colour_counts_its_styles_colours -- --exact --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" script::glue_create::tests::a_hair_colour_counts_its_styles_colours
          tests=(
            net::p2p::profile::appearance_tests::stock_random_cycle_and_body_switches_reach_profile_for_all_classic_bodies
            net::p2p::profile::appearance_tests::zero_or_missing_catalog_choices_are_not_synthesized_as_zero
            char_create::appearance_tests::hair_style_changes_clamp_color_and_color_cycles_use_current_style
            char_create::appearance_tests::race_or_gender_change_clamps_style_before_color
            char_create::appearance_tests::repeated_randomization_uses_the_new_style_color_range
            char_create::appearance_tests::missing_catalog_has_single_zero_choice_after_all_operations
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify rock crossing and terrain separation fixtures
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            player::mover::rock_tests::walking_over_a_closed_rock_never_crosses_the_separate_terrain
            player::mover::rock_tests::walking_off_a_closed_rock_without_terrain_still_falls
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify moving character voice emitters
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            sound::kit::tests::attached_one_shots_follow_without_changing_fixed_sounds_loops_or_2d_audio
            sound::kit::tests::emote_emitter_follows_each_speaker_and_preserves_voice_attachment_fallback
            sound::kit::tests::emote_emitter_uses_live_model_attachment_instead_of_origin_or_fallback
            sound::kit::tests::model_child_voice_follows_world_origin_not_its_local_seat_offset
            sound::creature::tests::creature_vocals_follow_but_wing_and_unknown_events_stay_fixed
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify attached audio ordering and schedule ambiguity
        shell: bash
        env:
          WOW_AMBIGUITY_DUMP: '1'
        run: |
          set -euo pipefail
          tests=(
            game_plugins::schedule_tests::attached_audio_reads_after_rig_anchor_and_camera_pose_writers
            game_plugins::schedule_tests::the_schedules_have_no_more_undeclared_orders_than_the_ceilings_say
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify world API boundary and public camera presentation
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/world-api-doorway.log"
          mbx test --locked -p benilla-app --test world_api_wall the_world_api_doorway_stays_shut -- --exact --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" the_world_api_doorway_stays_shut
          log="$RUNNER_TEMP/world-camera-presentation.log"
          mbx test --locked -p benilla-world --lib view::tests::a_reader_in_present_sees_this_frames_camera -- --exact --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" view::tests::a_reader_in_present_sees_this_frames_camera
      - name: Verify navigation helper prerequisite
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/native-resident-navigation-helper.log"
          mbx test --locked -p benilla-native-nav-generator --test process empty_request_runs_without_inherited_environment -- --exact --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" empty_request_runs_without_inherited_environment
      - name: Verify private resident reconstruction adapter
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/resident-reconstruction.log"
          mbx test --locked -p benilla-native-corridor-tests --lib resident_reconstruction_ -- --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            source_cache_reconstruction::resident::tests::resident_reconstruction_requires_exact_fresh_owner_and_single_attachment \
            source_cache_reconstruction::resident::tests::resident_reconstruction_rejects_used_query_even_with_new_empty_ledger
          log="$RUNNER_TEMP/reconstruction-components.log"
          mbx test --locked -p benilla-native-corridor-tests --lib reconstruction_component_tests:: -- --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            reconstruction_component_tests::fresh_mesh_reconstructs_no_path_then_mid_wander_arrival_next_leg_and_second_save \
            reconstruction_component_tests::failure_after_reconstructed_no_path_and_normal_leg_discards_the_whole_fresh_session \
            reconstruction_component_tests::receipt_only_replay_cannot_reconstruct_and_failure_keeps_saved_bytes_and_lock_reusable \
            reconstruction_component_tests::changed_genesis_geometry_binding_and_late_failure_publish_no_reconstructed_session \
            reconstruction_component_tests::rolled_back_first_calculation_cannot_supply_reconstruction_candidates \
            reconstruction_component_tests::blocked_store_cannot_publish_a_session_from_its_old_recipe \
            reconstruction_component_tests::natural_death_reanchors_then_fresh_respawn_crosses_the_old_total_tick_limit \
            reconstruction_component_tests::natural_home_reset_reanchors_without_changing_generation_or_next_wander
          log="$RUNNER_TEMP/suspended-owner-reconstruction.log"
          mbx test --locked -p benilla-native-corridor-tests --lib suspended_owner_component_tests::complete_cache_free_anchor_history_reexecutes_both_owners_on_fresh_providers -- --exact --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            suspended_owner_component_tests::complete_cache_free_anchor_history_reexecutes_both_owners_on_fresh_providers
      - name: Verify controller recipe capture and save barrier
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            net::p2p::native_geometry::source_route_resident_controller::resident_controller_recipe_captures_cold_and_first_retained_through_real_save_barrier
            net::p2p::world::native_controller::tests::route_commit_tests::recipe_controller_save_failure_and_lost_ack_preserve_once_only_publication
            net::p2p::world::native_controller::tests::route_commit_tests::checkpoint_failure_retains_notice_and_retry_publishes_before_ack_failure
            net::p2p::world::native_controller::tests::route_commit_tests::actual_driver_routes_ack_retry_without_replaying_the_committed_tick
          )
          for test in "${tests[@]}"; do
            log="$RUNNER_TEMP/${test//::/-}.log"
            mbx test --locked -p benilla-app --lib "$test" -- --exact --show-output --test-threads=1 --color never | tee "$log"
            python3 scripts/verify-libtest-output.py "$log" "$test"
          done
      - name: Verify bounded fresh resident recipe restart
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/resident-recipe-restart.log"
          mbx test --locked -p benilla-app --lib net::p2p::native_geometry::source_route_resident_restart:: -- --show-output --test-threads=1 --color never | tee "$log"
          python3 scripts/verify-libtest-output.py "$log" \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_fresh_recipe_replay_then_third_epoch_matches_uninterrupted \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_cancelled_replay_releases_all_owners_without_publication \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_expired_replay_releases_all_owners_without_publication \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_late_failure_after_cold_prefix_preserves_committed_bytes \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_full_record_mismatch_rejects_before_publication \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_changed_consumed_source_after_cold_prefix_refuses_replay \
            net::p2p::native_geometry::source_route_resident_restart::resident_controller_recipe_tampered_envelope_refuses_before_publication
      - name: Verify bounded accepted quest restart and durable fixture regressions
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::restart::accepted_loaded_quest_fresh_replay_finishes_combat_loot_and_reward_exactly
            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::restart::accepted_loaded_quest_late_replay_failure_releases_owners_and_preserves_bytes
            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::restart::accepted_loaded_quest_resumed_save_and_lost_ack_retry_publish_once
            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::installed_loaded_quest_loop_completes_stock_commands_in_both_orders_and_role_ids
            net::p2p::native_geometry::source_route_same_polygon_local::quest_loop_tests::installed_loaded_quest_loop_rolls_back_late_giver_and_retries_durable_publication
            net::p2p::world::native_controller::tests::distinct_quest_loop_tests::loaded::copied_durable_fixture_reopens_exact_published_bytes
